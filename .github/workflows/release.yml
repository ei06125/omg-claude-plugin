name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_LINK_MODE: copy
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.11.30
          enable-cache: true
          python-version: "3.13"

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest

  release:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # push the release branch and the tag
      pull-requests: write # open and close release pull requests
      actions: write # start the tag workflow
    env:
      UV_LINK_MODE: copy
      RELEASE_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.11.30
          enable-cache: true
          python-version: "3.13"

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Publish the release
        id: publish
        run: |
          code=0
          uv run python tools/release.py publish \
            --remote "https://x-access-token@github.com/${GITHUB_REPOSITORY}.git" \
            --target main || code=$?
          if [ "$code" -eq 78 ]; then
            echo "::warning title=Release automation is not configured::See the setup section of documentation/Product/Features/omg-release.md"
            exit 0
          fi
          exit "$code"

      - name: Start the tag workflow
        if: steps.publish.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.publish.outputs.tag }}
        run: gh workflow run release-tag.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
