name: Assign pull request author

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  assign-author:
    runs-on: ubuntu-latest
    steps:
      - name: Assign author
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          jq --null-input --arg author "$AUTHOR" '{assignees: [$author]}' |
            gh api --method POST "repos/${GH_REPO}/issues/${PR_NUMBER}/assignees" --input -
