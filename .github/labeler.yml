"area: ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - ".gitlab/**"
          - ".gitlab-ci.yml"
          - "tools/ci-local.sh"

"area: documentation":
  - changed-files:
      - any-glob-to-any-file:
          - "documentation/**"
          - "*.md"

"area: governance":
  - changed-files:
      - any-glob-to-any-file: ".agents/Governance/**"

"area: plugin":
  - changed-files:
      - any-glob-to-any-file:
          - ".claude-plugin/**"
          - ".claude/**"

"area: tests":
  - changed-files:
      - any-glob-to-any-file: "tests/**"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - ".pre-commit-config.yaml"
          - "pyproject.toml"
          - "uv.lock"
