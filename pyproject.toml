[project]
name = "omg-claude-plugin"
version = "0.1.0"
description = "Development tooling for the omg Claude Code plugin"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4.6,<5",
    "pytest>=9.1.1",
    "pytest-bdd>=8.1.0",
    "pyyaml>=6.0.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
bdd_features_base_dir = "tests/acceptance/features"
addopts = "-m 'not claude_cli'"
markers = ["claude_cli: needs an authenticated claude CLI and makes real model calls; not run in CI"]
