[project]
name = "omg-claude-plugin"
version = "0.1.0"
description = "Development tooling for the omg Claude Code plugin"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4.6,<5",
    "pytest>=9.1.1",
    "pytest-bdd>=8.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.8,<0.17",
    "rumdl>=0.2.74,<0.3",
    "shellcheck-py>=0.11.0.1,<0.12",
    "yamllint>=1.38,<2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools", "tests"]
bdd_features_base_dir = "tests/acceptance/features"
addopts = "-m 'not claude_cli'"
markers = ["claude_cli: needs an authenticated claude CLI and makes real model calls; not run in CI"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"

[tool.rumdl]
disable = ["MD013"]
flavor = "gfm"
line-length = 120
respect-gitignore = true

[tool.rumdl.per-file-ignores]
".claude/skills/**/*.md" = ["MD041"]
