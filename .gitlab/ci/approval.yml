approval:
  stage: approval
  image: alpine:3.22.1@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      set -euo pipefail

      notes_file=$(mktemp)
      curl --fail --silent --show-error \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --output "$notes_file" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes?per_page=100&sort=desc"

      jq --exit-status --arg username "$APPROVAL_USERNAME" '
        any(.[];
          .system == false
          and .author.username == $username
          and (.body | test("(^|[[:space:]])Approved([[:space:]]|$)"))
        )
      ' "$notes_file" >/dev/null || {
        echo "Approval comment from @${APPROVAL_USERNAME} is required."
        exit 1
      }
